clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend-docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/backend"
        action: keep
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - replacement: backend
        target_label: job
      - source_labels: [__meta_docker_container_name]
        regex: "/(.+)"
        target_label: service_name
        replacement: "$1"
    pipeline_stages:
      - json:
          expressions:
            level: level
            type: type
            user_role: user_role
            extracted_prefix: prefix
            extracted_type: type
      - template:
          source: final_type
          template: '{{ if .extracted_type }}{{ .extracted_type }}{{ else }}{{ .extracted_prefix }}{{ end }}'
      - labels:
          level: extracted_level
          type: final_type
