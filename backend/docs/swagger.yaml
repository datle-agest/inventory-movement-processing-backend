basePath: /api
definitions:
  common.AppError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  core.APIResponse:
    properties:
      code:
        type: integer
      message:
        type: string
      pagination:
        $ref: '#/definitions/core.Pagination'
      result: {}
    type: object
  core.Pagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  entity.Item:
    properties:
      created_at:
        type: string
      current_stock:
        type: integer
      id:
        type: integer
      low_stock_threshold:
        type: integer
      name:
        type: string
      sku:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for inventory movement processing system
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Inventory Movement Processing API
  version: "1.0"
paths:
  /v1/inventory-movements/import:
    post:
      consumes:
      - multipart/form-data
      description: Upload CSV file to process inventory movements in batch
      parameters:
      - description: CSV file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Import result summary
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  type: object
              type: object
        "400":
          description: Invalid file or request
          schema:
            $ref: '#/definitions/core.APIResponse'
        "409":
          description: Duplicate movement
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.APIResponse'
      summary: Import inventory movements from CSV
      tags:
      - Movements
  /v1/items:
    get:
      consumes:
      - application/json
      description: Get list of all inventory items
      produces:
      - application/json
      responses:
        "200":
          description: List of items
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/entity.Item'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.APIResponse'
      summary: List all items
      tags:
      - Items
    post:
      consumes:
      - application/json
      description: Create a new inventory item
      parameters:
      - description: Item data
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/entity.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Item created successfully
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  $ref: '#/definitions/entity.Item'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.APIResponse'
      summary: Create new item
      tags:
      - Items
  /v1/items/{id}:
    get:
      consumes:
      - application/json
      description: Get a single inventory item by ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Item details
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  $ref: '#/definitions/entity.Item'
              type: object
        "400":
          description: Invalid item ID
          schema:
            $ref: '#/definitions/core.APIResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.APIResponse'
      summary: Get item by ID
      tags:
      - Items
  /v1/items/{id}/movements:
    get:
      consumes:
      - application/json
      description: Get all inventory movements for a specific item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of movements for the item
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  items:
                    type: object
                  type: array
              type: object
        "400":
          description: Invalid item ID
          schema:
            $ref: '#/definitions/core.APIResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/core.APIResponse'
      summary: Get movements by item ID
      tags:
      - Items
  /v1/reports/daily:
    get:
      description: Returns the most active inventory items for a given date.
      parameters:
      - description: Report date (YYYY-MM-DD). Defaults to today.
        in: query
        name: date
        type: string
      - description: 'Number of top items to return (default: 5)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/core.APIResponse'
        "400":
          description: Invalid query parameter
          schema:
            $ref: '#/definitions/common.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.AppError'
      summary: List top active items by date
      tags:
      - Reports
schemes:
- http
- https
swagger: "2.0"
