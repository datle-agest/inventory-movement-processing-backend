basePath: /api
definitions:
  core.APIResponse:
    properties:
      code:
        example: SUCCESS
        type: string
      message:
        example: success
        type: string
      pagination:
        $ref: '#/definitions/core.Pagination'
      result: {}
    type: object
  core.APIResponseNoPage:
    properties:
      code:
        example: SUCCESS
        type: string
      message:
        example: success
        type: string
      result: {}
    type: object
  core.APIResponseNoResult:
    properties:
      code:
        example: SUCCESS
        type: string
      message:
        example: success
        type: string
    type: object
  core.ErrResponseBadRequest:
    properties:
      code:
        example: INVALID_INPUT
        type: string
      message:
        example: invalid request
        type: string
    type: object
  core.ErrResponseConflict:
    properties:
      code:
        example: DUPLICATE_TRANSACTION
        type: string
      message:
        example: duplicate transaction detected
        type: string
    type: object
  core.ErrResponseInternal:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      message:
        example: internal server error
        type: string
    type: object
  core.ErrResponseItemConflict:
    properties:
      code:
        example: DUPLICATE_SKU
        type: string
      message:
        example: duplicate SKU detected
        type: string
    type: object
  core.ErrResponseItemNotFound:
    properties:
      code:
        example: ITEM_NOT_FOUND
        type: string
      message:
        example: item not found
        type: string
    type: object
  core.Pagination:
    properties:
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 100
        type: integer
    type: object
  entity.CachedReport:
    properties:
      generated_at:
        description: |-
          GeneratedAt acts as a Logical TTL marker. It enables:
          1. Graceful Degradation: If the DB is down, we can fallback to serving slightly stale data instead of returning a 500 error.
          2. Cache Stampede Prevention: Allows implementing the Stale-While-Revalidate pattern when multiple requests hit an expired cache.
          3. Observability: Provides exact snapshot timing for debugging purposes.
        example: "2026-05-22T08:00:00Z"
        type: string
      items:
        items:
          $ref: '#/definitions/entity.DailyItemSummary'
        type: array
    type: object
  entity.CreateItemRequest:
    properties:
      current_stock:
        minimum: 0
        type: integer
      low_stock_threshold:
        minimum: 0
        type: integer
      name:
        maxLength: 100
        minLength: 2
        type: string
      sku:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    - sku
    type: object
  entity.DailyItemSummary:
    properties:
      created_at:
        example: "2024-01-15T10:30:00Z"
        type: string
      id:
        example: 1
        type: integer
      item_id:
        example: 1
        type: integer
      summary_date:
        example: "2026-05-22T00:00:00Z"
        type: string
      total_adjust:
        example: 10
        type: integer
      total_in:
        example: 100
        type: integer
      total_out:
        example: 40
        type: integer
      updated_at:
        example: "2024-01-15T10:30:00Z"
        type: string
    type: object
  entity.ImportBatchFailedInfo:
    properties:
      error_report_file:
        type: string
      total_failed:
        type: integer
    type: object
  entity.ImportBatchResult:
    properties:
      duplicate:
        example: 0
        type: integer
      failed_info:
        $ref: '#/definitions/entity.ImportBatchFailedInfo'
      rejected:
        example: 1
        type: integer
      success:
        example: 999
        type: integer
      total:
        example: 1000
        type: integer
    type: object
  entity.Item:
    properties:
      created_at:
        example: "2024-01-15T10:30:00Z"
        type: string
      current_stock:
        example: 150
        type: integer
      id:
        example: 1
        type: integer
      low_stock_threshold:
        example: 10
        type: integer
      name:
        example: Laptop Dell XPS 15
        type: string
      sku:
        example: SKU-001
        type: string
      updated_at:
        example: "2024-01-15T10:30:00Z"
        type: string
    type: object
  entity.Movement:
    properties:
      created_at:
        example: "2024-01-15T10:30:00Z"
        type: string
      external_id:
        example: TXN-120001
        type: string
      id:
        example: 1
        type: integer
      item_id:
        example: 1
        type: integer
      movement_time:
        example: "2026-05-22T08:00:00Z"
        type: string
      movement_type:
        allOf:
        - $ref: '#/definitions/entity.MovementType'
        enum:
        - IN
        - OUT
        - ADJUST
        example: IN
      note:
        example: Initial stock import batch 1
        type: string
      quantity:
        example: 50
        type: integer
      updated_at:
        example: "2024-01-15T10:30:00Z"
        type: string
    type: object
  entity.MovementType:
    enum:
    - IN
    - OUT
    - ADJUST
    type: string
    x-enum-varnames:
    - MovementTypeIn
    - MovementTypeOut
    - MovementTypeAdjust
host: localhost:3000
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for inventory movement processing system
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Inventory Movement Processing API
  version: "1.0"
paths:
  /v1/inventory-movements/import:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Uploads a CSV file containing stock movements (IN, OUT, ADJUST) to process in batch.
        The engine validates the CSV format and groups rows by item ID.
        Movements are then processed concurrently via a worker pool, ensuring non-negative stock limits and avoiding duplicate external IDs.
        Returns a summary of the batch import execution including success/fail counts and row-level details.
      parameters:
      - description: 'CSV file to import (required, max size: 5MB)'
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  $ref: '#/definitions/entity.ImportBatchResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrResponseBadRequest'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core.ErrResponseConflict'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.ErrResponseInternal'
      security:
      - BearerAuth: []
      summary: Import inventory movements from a CSV file
      tags:
      - Movements
  /v1/items:
    get:
      consumes:
      - application/json
      description: |-
        Returns a paginated list of inventory items.
        Supports rich filtering by SKU, name, quantity ranges, low-stock status, and custom sorting options.
      parameters:
      - description: Filter by product name substring
        in: query
        name: name
        type: string
      - description: Filter by product SKU prefix
        in: query
        name: sku
        type: string
      - description: Filter for items currently running below their safety threshold
        in: query
        name: low_stock
        type: boolean
      - description: Filter for items with zero quantity
        in: query
        name: out_of_stock
        type: boolean
      - description: Filter items with quantity greater than or equal to this value
        in: query
        name: min_qty
        type: integer
      - description: Filter items with quantity less than or equal to this value
        in: query
        name: max_qty
        type: integer
      - description: Field name to sort by (e.g., name, sku, current_stock)
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction: asc or desc'
        in: query
        name: sort_order
        type: string
      - description: 'Page number for pagination (Default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Maximum number of records per page (Default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/entity.Item'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrResponseBadRequest'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.ErrResponseInternal'
      security:
      - BearerAuth: []
      summary: List and filter inventory items
      tags:
      - Items
    post:
      consumes:
      - application/json
      description: |-
        Registers a new product SKU in the warehouse.
        Ensures SKU is unique and initial stock levels are non-negative.
      parameters:
      - description: Product registration details including SKU, name, initial stock,
          and safety threshold.
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/entity.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/core.APIResponseNoResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrResponseBadRequest'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core.ErrResponseItemConflict'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.ErrResponseInternal'
      security:
      - BearerAuth: []
      summary: Register a new inventory item
      tags:
      - Items
  /v1/items/{id}:
    get:
      consumes:
      - application/json
      description: Fetches details of a single inventory item, including current stock
        and safety threshold, using its unique ID.
      parameters:
      - description: Unique database ID of the inventory item
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponseNoPage'
            - properties:
                result:
                  $ref: '#/definitions/entity.Item'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrResponseBadRequest'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrResponseItemNotFound'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.ErrResponseInternal'
      security:
      - BearerAuth: []
      summary: Retrieve an inventory item by ID
      tags:
      - Items
  /v1/items/{id}/movements:
    get:
      consumes:
      - application/json
      description: |-
        Fetches paginated inventory movement records associated with a specific item.
        Supports pagination through `page` and `limit` query parameters.
        Returns movement history ordered according to repository configuration.
      parameters:
      - description: Unique identifier of the inventory item
        in: path
        name: id
        required: true
        type: integer
      - description: Page number for pagination. Must be greater than 0. Default is
          1.
        in: query
        name: page
        type: integer
      - description: Maximum number of movement records per page. Must be greater
          than 0. Default is 10.
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                pagination:
                  $ref: '#/definitions/core.Pagination'
                result:
                  items:
                    $ref: '#/definitions/entity.Movement'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrResponseBadRequest'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrResponseItemNotFound'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.ErrResponseInternal'
      security:
      - BearerAuth: []
      summary: Retrieve inventory movement history by item ID
      tags:
      - Items
  /v1/reports/daily:
    get:
      description: |-
        Fetches a summary of the most actively moved inventory items for a specific date.
        Implements a stale-while-revalidate caching mechanism to ensure high availability and graceful fallback during database disruptions.
        If the requested date is the current system date, the response will additionally include items that have fallen below the low-stock threshold.
      parameters:
      - description: Target date for the report in YYYY-MM-DD format. Defaults to
          the current date if omitted.
        in: query
        name: date
        type: string
      - description: Maximum number of top active items to retrieve. Must be a strictly
          positive integer. Default is 5.
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  $ref: '#/definitions/entity.CachedReport'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrResponseBadRequest'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.ErrResponseInternal'
      security:
      - BearerAuth: []
      summary: Retrieve the daily active inventory report
      tags:
      - Reports
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and JWT token. Example: "Bearer
      eyJhbGci..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
