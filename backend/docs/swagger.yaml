basePath: /api
definitions:
  core.APIResponse:
    properties:
      code:
        type: integer
      message:
        type: string
      pagination:
        $ref: '#/definitions/core.Pagination'
      result: {}
    type: object
  core.Pagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  entity.Item:
    properties:
      created_at:
        type: string
      current_stock:
        type: integer
      id:
        type: integer
      low_stock_threshold:
        type: integer
      name:
        type: string
      sku:
        type: string
      updated_at:
        type: string
    type: object
  service.ImportBatchResult:
    properties:
      duplicate:
        type: integer
      failed_rows:
        items:
          $ref: '#/definitions/service.ProcessResult'
        type: array
      rejected:
        type: integer
      success:
        type: integer
      total:
        type: integer
    type: object
  service.ProcessResult:
    properties:
      error_reason:
        type: string
      external_id:
        type: string
      row_index:
        type: integer
      status:
        $ref: '#/definitions/service.ProcessStatus'
    type: object
  service.ProcessStatus:
    enum:
    - accepted
    - rejected
    - duplicate
    type: string
    x-enum-varnames:
    - StatusAccepted
    - StatusRejected
    - StatusDuplicate
host: localhost:3000
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for inventory movement processing system
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Inventory Movement Processing API
  version: "1.0"
paths:
  /v1/inventory-movements/import:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Uploads a CSV file containing stock movements (IN, OUT, ADJUST) to process in batch.
        The engine validates the CSV format and groups rows by item ID.
        Movements are then processed concurrently via a worker pool, ensuring non-negative stock limits and avoiding duplicate external IDs.
        Returns a summary of the batch import execution including success/fail counts and row-level details.
      parameters:
      - description: 'CSV file to import (required, max size: 5MB)'
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Successful batch processing summary
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  $ref: '#/definitions/service.ImportBatchResult'
              type: object
        "400":
          description: Bad Request - Missing file, empty file, invalid format, or
            malformed CSV header
          schema:
            $ref: '#/definitions/core.APIResponse'
        "409":
          description: Conflict - Duplicate transaction detected
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal Server Error - Failed to read/process file
          schema:
            $ref: '#/definitions/core.APIResponse'
      security:
      - BearerAuth: []
      summary: Import inventory movements from a CSV file
      tags:
      - Movements
  /v1/items:
    get:
      consumes:
      - application/json
      description: |-
        Returns a paginated list of inventory items.
        Supports rich filtering by SKU, name, quantity ranges, low-stock status, and custom sorting options.
      parameters:
      - description: Filter by product name substring
        in: query
        name: name
        type: string
      - description: Filter by product SKU prefix
        in: query
        name: sku
        type: string
      - description: Filter for items currently running below their safety threshold
        in: query
        name: low_stock
        type: boolean
      - description: Filter for items with zero quantity
        in: query
        name: out_of_stock
        type: boolean
      - description: Filter items with quantity greater than or equal to this value
        in: query
        name: min_qty
        type: integer
      - description: Filter items with quantity less than or equal to this value
        in: query
        name: max_qty
        type: integer
      - description: Field name to sort by (e.g., name, sku, current_stock)
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction: asc or desc'
        in: query
        name: sort_order
        type: string
      - description: 'Page number for pagination (Default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Maximum number of records per page (Default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved paginated list of items
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  items:
                    $ref: '#/definitions/entity.Item'
                  type: array
              type: object
        "400":
          description: Bad Request - Invalid query or sorting parameters
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal Server Error - Database read failure
          schema:
            $ref: '#/definitions/core.APIResponse'
      security:
      - BearerAuth: []
      summary: List and filter inventory items
      tags:
      - Items
    post:
      consumes:
      - application/json
      description: |-
        Registers a new product SKU in the warehouse.
        Ensures SKU is unique and initial stock levels are non-negative.
      parameters:
      - description: Product registration details including SKU, name, initial stock,
          and safety threshold.
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/entity.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Product registered successfully
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  $ref: '#/definitions/entity.Item'
              type: object
        "400":
          description: Bad Request - Invalid input data, missing required fields,
            or negative values
          schema:
            $ref: '#/definitions/core.APIResponse'
        "409":
          description: Conflict - Duplicate SKU detected
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal Server Error - Database write failure
          schema:
            $ref: '#/definitions/core.APIResponse'
      security:
      - BearerAuth: []
      summary: Register a new inventory item
      tags:
      - Items
  /v1/items/{id}:
    get:
      consumes:
      - application/json
      description: Fetches details of a single inventory item, including current stock
        and safety threshold, using its unique ID.
      parameters:
      - description: Unique database ID of the inventory item
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved item details
          schema:
            allOf:
            - $ref: '#/definitions/core.APIResponse'
            - properties:
                result:
                  $ref: '#/definitions/entity.Item'
              type: object
        "400":
          description: Bad Request - Invalid database ID format
          schema:
            $ref: '#/definitions/core.APIResponse'
        "404":
          description: Not Found - Item with the specified ID does not exist
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal Server Error - Database read failure
          schema:
            $ref: '#/definitions/core.APIResponse'
      security:
      - BearerAuth: []
      summary: Retrieve an inventory item by ID
      tags:
      - Items
  /v1/items/{id}/movements:
    get:
      consumes:
      - application/json
      description: |-
        Fetches paginated inventory movement records associated with a specific item.
        Supports pagination through `page` and `limit` query parameters.
        Returns movement history ordered according to repository configuration.
      parameters:
      - description: Unique identifier of the inventory item
        in: path
        name: id
        required: true
        type: integer
      - description: Page number for pagination. Must be greater than 0. Default is
          1.
        in: query
        name: page
        type: integer
      - description: Maximum number of movement records per page. Must be greater
          than 0. Default is 10.
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved movement history
          schema:
            $ref: '#/definitions/core.APIResponse'
        "400":
          description: Bad Request - Invalid item ID or pagination parameters
          schema:
            $ref: '#/definitions/core.APIResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal Server Error - Failed to retrieve movement history
          schema:
            $ref: '#/definitions/core.APIResponse'
      security:
      - BearerAuth: []
      summary: Retrieve inventory movement history by item ID
      tags:
      - Items
  /v1/reports/daily:
    get:
      description: |-
        Fetches a summary of the most actively moved inventory items for a specific date.
        Implements a stale-while-revalidate caching mechanism to ensure high availability and graceful fallback during database disruptions.
        If the requested date is the current system date, the response will additionally include items that have fallen below the low-stock threshold.
      parameters:
      - description: Target date for the report in YYYY-MM-DD format. Defaults to
          the current date if omitted.
        in: query
        name: date
        type: string
      - description: Maximum number of top active items to retrieve. Must be a strictly
          positive integer. Default is 5.
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved the daily report
          schema:
            $ref: '#/definitions/core.APIResponse'
        "400":
          description: Bad Request - Invalid date format or non-positive limit parameter
          schema:
            $ref: '#/definitions/core.APIResponse'
        "500":
          description: Internal Server Error - Database, aggregation, or caching layer
            failure
          schema:
            $ref: '#/definitions/core.APIResponse'
      security:
      - BearerAuth: []
      summary: Retrieve the daily active inventory report
      tags:
      - Reports
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer {your JWT token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
